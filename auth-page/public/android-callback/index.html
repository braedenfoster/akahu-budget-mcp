<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <title>Opening Budget</title>
    <style>
      body { font-family: system-ui, sans-serif; margin: 0; padding: 48px 16px; text-align: center; background: #fff; color: #111; }
      a { display: inline-block; margin-top: 16px; padding: 12px 24px; border-radius: 8px; background: #111; color: #fff; text-decoration: none; }
      @media (prefers-color-scheme: dark) {
        body { background: #111; color: #eee; }
        a { background: #eee; color: #111; }
      }
    </style>
  </head>
  <body>
    <!-- Stytch only redirects to http(s) URLs. This page hands the authorization
         response to the Android app's custom scheme. PKCE keeps the code useless
         without the verifier, which stays on the phone. -->
    <p>Returning to the Budget app…</p>
    <a id="open" href="nz.foster.budget:/oauth/callback">Open Budget</a>
    <script>
      const target = 'nz.foster.budget:/oauth/callback' + location.search;
      document.getElementById('open').href = target;
      location.replace(target);
    </script>
  </body>
</html>
